<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Among Us</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #231F20;
        overflow: hidden;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #231F20;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-loading-status" role="status">Loading… 0%</div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      // 【強制英語化】
      Object.defineProperty(navigator, 'language', { get: function() { return 'en-US'; }, configurable: true });
      Object.defineProperty(navigator, 'languages', { get: function() { return ['en-US', 'en']; }, configurable: true });

      // 【極限軽量化・DPI 0.65】
      Object.defineProperty(window, 'devicePixelRatio', { get: function() { return 0.65; } });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var loadingStatus = document.querySelector("#unity-loading-status");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        if (type == 'error') warningBanner.innerHTML = '<div style="background:red;padding:10px;color:white;">' + msg + '</div>';
        warningBanner.style.display = warningBanner.innerHTML ? 'block' : 'none';
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/AmongUsWeb.loader.js";
      var config = {
        dataUrl: buildUrl + "/AmongUsWeb.data",
        frameworkUrl: buildUrl + "/AmongUsWeb.framework.js",
        codeUrl: buildUrl + "/AmongUsWeb.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Innersloth",
        productName: "Among Us",
        productVersion: "2026.6.5",
        showBanner: unityShowBanner,
        webglContextAttributes: { preserveDrawingBuffer: false, powerPreference: "high-performance", antialias: false, alpha: false }
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        container.className = "unity-desktop";
      }

      loadingBar.style.display = "block";
      canvas.style.visibility = "hidden";

      var nativeFetch = window.fetch.bind(window);
      var NativeWebSocket = window.WebSocket;

      var overrideServer = new URLSearchParams(location.search).get("server");
      var serverReplacement = null;
      if (overrideServer) {
        try { serverReplacement = new URL(overrideServer); } catch (e) {}
      }

      if (serverReplacement) {
        window.WebSocket = function(url, protocols) {
          var targetUrl = url;
          try {
            var target = new URL(url, location.href);
            if (target.host !== location.host && !target.protocol.includes('blob')) {
              target.protocol = serverReplacement.protocol === "https:" ? "wss:" : "ws:";
              target.host = serverReplacement.host;
              targetUrl = target.toString();
            }
          } catch(e) {}
          return protocols !== undefined ? new NativeWebSocket(targetUrl, protocols) : new NativeWebSocket(targetUrl);
        };
        window.WebSocket.prototype = NativeWebSocket.prototype;
      }

      var streamingAssetFiles = [
        "StreamingAssets/aa/AddressablesLink/link.xml",
        "StreamingAssets/aa/catalog.json",
        "StreamingAssets/aa/settings.json",
        "StreamingAssets/aa/WebGL/453b0a9b2ef9b8a4080b2014844ce426_unitybuiltinshaders_2536dfd3f978a44e0658621a7478bc60.bundle",
        "StreamingAssets/CustomAssetPacksData.json",
        "StreamingAssets/UnityServicesProjectConfiguration.json"
      ];

      var streamingAssetCache = new Map();

      async function fetchBlob(url) {
        var res = await nativeFetch(url, { cache: "force-cache" });
        if (!res.ok) throw new Error("Failed: " + url);
        return await res.blob();
      }

      async function preloadAssets() {
        await Promise.all(streamingAssetFiles.map(async (file) => {
          var url = new URL(file, location.href).href;
          streamingAssetCache.set(url, fetchBlob(url));
        }));
      }

      window.fetch = function(resource, options) {
        var reqUrl = typeof resource === "string" ? resource : resource instanceof URL ? resource.href : resource.url;
        var cleanUrl = reqUrl.split("?")[0].split("#")[0];
        var cachedBlobPromise = streamingAssetCache.get(new URL(cleanUrl, location.href).href);
        if (cachedBlobPromise) {
          return cachedBlobPromise.then(blob => new Response(blob, { status: 200, headers: { "Content-Type": blob.type } }));
        }
        return nativeFetch(resource, options);
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = async () => {
        try {
          await preloadAssets();

          await createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = Math.round(progress * 100) + "%";
            loadingStatus.textContent = "Loading… " + Math.round(progress * 100) + "%";
          });

          canvas.style.visibility = "visible";
          loadingBar.style.display = "none";
        } catch (error) {
          loadingStatus.textContent = "Load failed";
          unityShowBanner(error.message || String(error), "error");
        }
      };

      script.onerror = function() {
        loadingStatus.textContent = "Failed to load loader script";
        unityShowBanner("AmongUsWeb.loader.js failed to load. Please check file paths.", "error");
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
